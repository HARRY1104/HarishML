<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWI Prediction System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.25rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-group input {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .input-group input::placeholder {
            color: rgba(148, 163, 184, 0.4);
        }

        .btn-submit {
            grid-column: 1 / -1;
            margin-top: 1rem;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.875rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .result-card {
            margin-top: 2rem;
            padding: 1.25rem;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.2);
            text-align: center;
        }

        .result-card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .result-card span {
            font-weight: 700;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>FWI Prediction</h1>
            <p>Fire Weather Index Machine Learning Interface</p>
        </div>

        <form action="{{ url_for('predict') }}" method="post" class="form-grid">
            <div class="input-group">
                <label for="Temperature">Temperature</label>
                <input type="text" id="Temperature" name="Temperature" placeholder="e.g. 29" required />
            </div>

            <div class="input-group">
                <label for="RH">RH</label>
                <input type="text" id="RH" name="RH" placeholder="e.g. 57" required />
            </div>

            <div class="input-group">
                <label for="Ws">Ws</label>
                <input type="text" id="Ws" name="Ws" placeholder="e.g. 18" required />
            </div>

            <div class="input-group">
                <label for="Rain">Rain</label>
                <input type="text" id="Rain" name="Rain" placeholder="e.g. 0.0" required />
            </div>

            <div class="input-group">
                <label for="FFMC">FFMC</label>
                <input type="text" id="FFMC" name="FFMC" placeholder="e.g. 65.7" required />
            </div>

            <div class="input-group">
                <label for="DMC">DMC</label>
                <input type="text" id="DMC" name="DMC" placeholder="e.g. 3.4" required />
            </div>

            <div class="input-group">
                <label for="ISI">ISI</label>
                <input type="text" id="ISI" name="ISI" placeholder="e.g. 1.3" required />
            </div>

            <div class="input-group">
                <label for="Classes">Classes</label>
                <input type="text" id="Classes" name="Classes" placeholder="e.g. 0 or 1" required />
            </div>

            <div class="input-group">
                <label for="Region">Region</label>
                <input type="text" id="Region" name="Region" placeholder="e.g. 0 or 1" required />
            </div>

            <button type="submit" class="btn-submit">Predict FWI</button>
        </form>

        <!-- FIX: Using 'is not none' avoids implicit boolean conversion on numpy arrays -->
        {% if result is defined and result is not none %}
        <div class="result-card">
            <h2>THE FWI PREDICTION IS: <span>{{ result }}</span></h2>
        </div>
        {% endif %}
    </div>

</body>
</html>
